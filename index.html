<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathijs van der Meijde</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #0D0D0D;
      overflow-x: hidden;
      position: relative;
    }

    .background--custom {
      width: 100vw;
      height: 100vh;
      position: fixed;
      z-index: -2;
      top: 0;
      left: 0;
      overflow: hidden;
      contain: strict;
      pointer-events: none;
    }

    canvas#canvas {
      z-index: -1;
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(0deg) scale(1.5) translateY(0%);
      filter: blur(25px);
      will-change: transform;
      pointer-events: none;
      --gradient-color-1: #111113;
      --gradient-color-2: #1F2639;
      --gradient-color-3: #351B54;
      --gradient-color-4: #2568A8;
      --gradient-speed: 0.000005;
    }
  </style>
  <script type="module" crossorigin src="/Portfolio/assets/index-BytaA9HZ.js"></script>
  <link rel="stylesheet" crossorigin href="/Portfolio/assets/index-C8ibksUN.css">
</head>
<body>
<div class="background--custom">
  <canvas id="canvas"></canvas>
</div>
<script defer src="/Portfolio/minigl.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    window.gradient = new Gradient();
    window.gradient.initGradient("#canvas");
  });
</script>
<div id="root"></div>
</body>
</html>
